name: Integration testing
on:
  workflow_dispatch:
  push:
  pull_request:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flex bison libfl-dev
      - name: watch flex&bison
        run: |
          flex --version
          bison --version
      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --config Debug --target kpc

      - name: Run Integration Tests
        run: |
          mkdir res
          python3 tests/black-box/run-gencode.py tests/black-box/generate/ res
