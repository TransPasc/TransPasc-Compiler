name: Cross-Platform Compiler

on:
  push:
    tags:
      - 'v*'
    branches: [ main ]
  workflow_dispatch: # Allows manual triggering of the workflow

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check CMake Version
        run: cmake --version

      - name: Check Ninja Version
        run: ninja --version

      - name: Check Git Version
        run: git --version
      - name: Check Flex Version
        run: flex --version
      - name: Check Bison Version
        run: bison --version
  build:
    needs: check
    strategy:
      matrix:
        os: [ubuntu-22.04, macos-13, windows-2022]
        arch: [x64, arm64]
        build_type: [Release]
      fail-fast: false
      max-parallel: 3

    runs-on: ${{ matrix.os }}
    env:
      BUILD_DIR: build-${{ matrix.os }}-${{ matrix.arch }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Toolchain
        uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
      - name: Install Ninja
        if: runner.os != 'Windows'
        run: |
          if [ "${{ matrix.os }}" == "ubuntu-22.04" ]; then
            sudo apt-get update
            sudo apt-get install -y ninja-build
          elif [ "${{ matrix.os }}" == "macos-13" ]; then
            brew update
            brew install ninja
          fi
      - name: Install Ninja on Windows
        if: runner.os == 'Windows'
        run: |
          choco install ninja -y
          choco upgrade ninja -y
          echo "C:\ProgramData\chocolatey\lib\ninja\tools" >> $GITHUB_PATH

      - name: Verify Ninja
        run: ninja --version

      - name: Install Cross Compilers
        run: |
          if [ "${{ matrix.os }}" == "ubuntu-22.04" ] && [ "${{ matrix.arch }}" == "arm64" ]; then
              sudo apt-get install gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libfl-dev:aarch64
          elif [ "${{ matrix.os }}" == "windows-2022" ] && [ "${{ matrix.arch }}" == "arm64" ]; then
              choco install llvm --params="/InstallDir:C:\llvm /Targets:ARM64"
              pacman -S mingw-w64-x86_64-flex
          elif [ "${{ matrix.os }}" == "macos-13" ] && [ "${{ matrix.arch }}" == "arm64" ]; then
              echo "No installation required for macOS arm64"
          elif [ "${{ matrix.os }}" == "ubuntu-22.04" ] && [ "${{ matrix.arch }}" == "x64" ]; then
              sudo apt-get install gcc g++ flex libfl-dev
          fi

      - uses: actions/cache@v4
        with:
          path: |
            ~/.ccache
            ${{ env.BUILD_DIR }}
          key: ${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('CMakeLists.txt','toolchains/*.cmake') }}

      - name: Validate Toolchains
        run: |
          if [ ! -f "cmake/toolchains/${{ matrix.os }}/${{ matrix.arch }}.cmake" ]; then
              echo "::error::Missing toolchain file for ${{ matrix.os }}/${{ matrix.arch }}"
              exit 1
          fi

      - name: Debug Environment
        run: |
          echo "PATH: $PATH"
          echo "CC: $CC"
          echo "CXX: $CXX"
          cmake --version

      - name: Configure CMake
        shell: bash
        run: |
          TOOLCHAIN_DIR="cmake/toolchains/${{ matrix.os }}"
          TOOLCHAIN_FILE="${TOOLCHAIN_DIR}/${{ matrix.arch }}.cmake"
          cmake -B ${{ env.BUILD_DIR }} \
                -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
                -DCMAKE_TOOLCHAIN_FILE=${TOOLCHAIN_FILE} \
                -DENABLE_TESTS=OFF \
                -GNinja

      - name: Build
        shell: bash
        run: cmake --build ${{ env.BUILD_DIR }} --parallel --target a.out

      - name: Package Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compiler-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ env.BUILD_DIR }}/bin/*
          if-no-files-found: error

  create-release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v3
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            artifacts/**/*
          body: |
            Multi-platform build for ${{ github.ref_name }}
            Supported systems:
            - Windows x64/arm64
            - Linux x64/arm64
            - macOS x64/arm64
