name: Linux ARM Compiler

on:
  push:
    tags:
      - 'v*'
    branches: [ main ]
  workflow_dispatch: # Allows manual triggering of the workflow
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flex bison libfl-dev gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Verify Dependencies
        run: |
          flex --version
          bison --version
          aarch64-linux-gnu-gcc --version
          aarch64-linux-gnu-g++ --version

      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/ubuntu-22.04/arm64.cmake -DENABLE_TESTS=OFF

      - name: Build
        run: cmake --build build --config Release --target kpc

      - name: Package Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kpc-arm64
          path: build/kpc
          if-no-files-found: error
          retention-days: 1

  create-release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            artifacts/**/*
          token: ${{ secrets.TRANSPASCAL_CI }}
          body: |
            Multi-platform build for ${{ github.ref_name }}
            Supported systems:
            - Linux arm64
