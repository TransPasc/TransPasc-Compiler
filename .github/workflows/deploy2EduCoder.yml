name: Deploy to EduCoder

on:
  workflow_run:
    workflows: ["Linux x64 Compiler"]
    types:
      - completed

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EduCoder_USER: ${{ secrets.EduCoder_USER }}
      EduCoder_PASS: ${{ secrets.EduCoder_PASS }}
      EduCoder_REPO: ${{ secrets.EduCoder_REPO }}
    steps:
    # 步骤1：克隆私有仓库（使用Secrets）
    - name: Clone private repository
      run: |
        git clone https://${EduCoder_USER}:${EduCoder_PASS}@${EduCoder_REPO}.git EduCoder
        cd EduCoder

    # 步骤2：生成动态标签（例如基于时间戳）
    - name: Generate new tag
      id: tag
      run: |
        CURRENT_TAG=$(date +'v%Y.%m.%d.%H%M%S')
        echo "NEW_TAG=$CURRENT_TAG" >> $GITHUB_ENV
        echo "::set-output name=tag::$CURRENT_TAG"

    # 步骤3：提交更改（假设有修改）
    - name: Commit changes
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git add .
        git commit -m "Auto-commit by CI [skip ci]"

    # 步骤4：推送更改及新标签
    - name: Push changes and tag
      env:
        REPO_USER: ${{ secrets.REPO_USER }}
        REPO_PASS: ${{ secrets.REPO_PASS }}
      run: |
        git push https://$REPO_USER:$REPO_PASS@${EduCoder_REPO}.git main
        git tag ${{ env.NEW_TAG }}
        git push origin ${{ env.NEW_TAG }}

    # 步骤5：创建 GitHub Release
    - name: Create Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # 自动生成的令牌
      with:
        tag_name: ${{ env.NEW_TAG }}
        release_name: Release ${{ env.NEW_TAG }}
        body: 由GitHub Actions自动创建
        draft: false
        prerelease: false
