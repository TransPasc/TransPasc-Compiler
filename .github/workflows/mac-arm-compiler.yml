name: Mac Arm Compiler

on:
  # push:
  #   tags:
  #     - 'v*'
  #   branches: [ main ]
  # TODO:
  push:
  workflow_dispatch: # Allows manual triggering of the workflow
  pull_request:
    branches: [ main ]
  workflow_run:
    workflows: ["CMake Test"]
    types:
      - completed
jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          brew update
          echo "update bison to bison 3.8+"
          brew install bison
      - name: Verify Dependencies
        run: |
          flex --version
          bison --version
          clang --version

      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/macos-13/arm64.cmake -DENABLE_TESTS=OFF

      - name: Build
        run: |
          cmake --build build --config Release --target kpc
          chmod +x build/kpc
          mv build/kpc build/kpc-macos-arm64
      - name: Package Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kpc-macos-arm64
          path: build/kpc-macos-arm64
          if-no-files-found: error
          retention-days: 1
  create-release:
    needs: build
    runs-on: macos-latest
    # TODO: rm this
    # if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            artifacts/**/*
          body: |
            Multi-platform build for ${{ github.ref_name }}
            Supported systems:
            - Windows x64/arm64
            - Linux x64/arm64
            - MacOS arm64